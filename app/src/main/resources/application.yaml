    name: catering-platform
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    locale: en
    locale-resolver: fixed

catering:
  tenant:
    default:
      id: 01a126ba-571b-7528-b147-9e6c0cc32e7e
